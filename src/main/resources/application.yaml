spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_SCHEMA}?autoReconnect=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    generate-ddl: true
    show-sql: false
    open-in-view: false
  oauth:
    uri: ${OAUTH_URI}
    id: ${OAUTH_ID}
    secret: ${OAUTH_SECRET}
    redirect-uri: ${OAUTH_REDIRECT_URI}
  mail:
    url: ${MAIL_URL}
    api-key: ${MAIL_API_KEY}
ranking:
  url: ${RANKING_URL}
crypto:
  aes-key: ${AES_SECRET}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
api:
  prefix: ${API_PREFIX}
